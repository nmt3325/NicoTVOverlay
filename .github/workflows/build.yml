name: Android build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore repository development signing key
        if: github.event_name != 'pull_request'
        env:
          DEVELOPMENT_KEYSTORE: ${{ secrets.NICO_DEV_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$DEVELOPMENT_KEYSTORE" ]; then
            android_user_home="$RUNNER_TEMP/nicotv-android"
            mkdir -p "$android_user_home"
            printf '%s' "$DEVELOPMENT_KEYSTORE" | base64 --decode > "$android_user_home/debug.keystore"
            chmod 600 "$android_user_home/debug.keystore"
            printf 'ANDROID_USER_HOME=%s\n' "$android_user_home" >> "$GITHUB_ENV"
          fi
      - name: Test, lint and build APKs
        run: ./gradlew --no-daemon :core:test :comment-client:test :detection:testDebugUnitTest :overlay:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NicoTVOverlay-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: NicoTVOverlay-release-unsigned-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 30
